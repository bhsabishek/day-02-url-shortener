name: day-2scenario
on:
    push:
        branches: ['feature']
    pull_request:
        branches: ['main']
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
            - run: |
                pip install -r requirements.txt
                python3 -m pytest
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |
                docker build -t url-shortner:v1 .
                docker run -d --name shortner -p 5000:5000 \
                -v shortner-data:/data -e DB_PATH=/data/shortner.db \
                url-shortner:v1
                
                for i in $(seq 1 10); do
                    curl -fsS localhost:5000/health && exit 0
                    sleep 2
                done
                docker logs shortner
                exit 1